# Local full stack for developers: docker compose up --build → http://localhost:8080
# (console e-mail backend: password reset links appear in `docker compose logs api`).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: foodo
      POSTGRES_USER: foodo
      POSTGRES_PASSWORD: foodo
    volumes:
      - pgdata-dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foodo -d foodo"]
      interval: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DJANGO_DEBUG: "1"
      DJANGO_SECURE: "0"
      DJANGO_SECRET_KEY: dev-only-secret
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,api
      DJANGO_CSRF_TRUSTED_ORIGINS: http://localhost:8080
      DATABASE_URL: postgres://foodo:foodo@db:5432/foodo
      FOODO_SITE_URL: http://localhost:8080
      FOODO_MIGRATE: "1"
      FOODO_LOAD_SEED: "1"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata-dev:
