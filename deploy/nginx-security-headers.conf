# Included in every location that sets its own add_header (nginx does not inherit them).
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy same-origin always;
add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;
# Same policy as the <meta> tag added by frontend/vite.config.ts, plus frame-ancestors.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
