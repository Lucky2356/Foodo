# Foodo web container. TLS is terminated in front (Caddy in docker-compose.prod.yml).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 4m;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location ~ ^/(api|admin|static/admin)/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 90s;
    }

    location /static/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
    }

    # The service worker and the app shell must always be revalidated so updates are noticed.
    location = /sw.js {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
    }
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
    }
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    # The API and admin keep their own Django security headers; the SPA gets these.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }
}
