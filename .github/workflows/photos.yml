name: Photos

# Recipe photos from Wikimedia Commons and Openverse, in two reviewed steps (docs/PHOTOS.md):
# 1. candidates: free-licensed candidates per recipe → numbered contact sheets (artifact);
# 2. apply: the photos chosen in shared/data/photos/selection.json are downloaded, resized to
#    WebP and returned with author/license data (artifact) to be committed after review.
on:
  pull_request:
    paths:
      - "scripts/photos/**"
      - "shared/data/photos/**"
      - ".github/workflows/photos.yml"
  workflow_dispatch:

permissions:
  contents: read

# One run at a time per branch: a newer push supersedes the older run (polite to Wikimedia).
concurrency:
  group: photos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  photos:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - run: pip install --require-hashes -r scripts/photos/requirements.txt
      - name: Candidates for recipes without a decision
        env:
          # Optional Openverse API credentials raise its rate limit; without them the anonymous limit applies.
          OPENVERSE_CLIENT_ID: ${{ secrets.OPENVERSE_CLIENT_ID }}
          OPENVERSE_CLIENT_SECRET: ${{ secrets.OPENVERSE_CLIENT_SECRET }}
          # Recipes per run; the rest get candidates on the next run (after review of this batch).
          PHOTO_BATCH: "200"
          # Retry pass for recipes left without a photo: more candidates per recipe.
          PHOTO_PER_RECIPE: "8"
        run: python -m scripts.photos.candidates out/candidates
      - name: Apply the reviewed selection
        if: hashFiles('shared/data/photos/selection.json') != ''
        env:
          OPENVERSE_CLIENT_ID: ${{ secrets.OPENVERSE_CLIENT_ID }}
          OPENVERSE_CLIENT_SECRET: ${{ secrets.OPENVERSE_CLIENT_SECRET }}
        run: python -m scripts.photos.apply out/applied
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: photos
          path: out
          retention-days: 7
