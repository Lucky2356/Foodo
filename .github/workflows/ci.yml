name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  PYTHON_VERSION: "3.13"

jobs:
  frontend:
    name: Frontend — lint, types, unit tests, builds
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Known vulnerabilities in runtime dependencies
        run: npm audit --omit=dev --audit-level=moderate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Server build (served by nginx next to the API)
        run: npx vite build
      - name: Static build (GitHub Pages, guest mode)
        run: npx vite build --mode static --outDir dist-static
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: static-site
          path: frontend/dist-static
          retention-days: 7

  backend:
    name: Backend — ruff, mypy, migrations, pytest on PostgreSQL
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: foodo
          POSTGRES_USER: foodo
          POSTGRES_PASSWORD: foodo
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U foodo -d foodo"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgres://foodo:foodo@127.0.0.1:5432/foodo
      FOODO_TESTING: "1"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install --require-hashes -r requirements.txt -r requirements-dev.txt
      - name: Known vulnerabilities in pinned dependencies
        run: pip-audit -r requirements.txt --require-hashes --disable-pip
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - name: No missing migrations
        run: python manage.py makemigrations --check --dry-run
      - name: Price and photo collectors — lint and unit tests (no network)
        working-directory: .
        run: |
          ruff check scripts
          ruff format --check scripts
          python -m pytest -p no:django -p no:cacheprovider -q scripts/prices/tests scripts/photos/tests scripts/catalog/tests
      - name: Catalog sources are valid and shared/data is rebuilt from them
        working-directory: .
        run: |
          python -m scripts.catalog.build
          git diff --exit-code -- shared/data scripts/catalog/sources
      - run: pytest

  e2e-guest:
    name: E2E — guest mode (static build, offline, 360 px, exports, privacy)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-guest-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7

  e2e-account:
    name: E2E — account mode against Django and PostgreSQL
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: foodo
          POSTGRES_USER: foodo
          POSTGRES_PASSWORD: foodo
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U foodo -d foodo"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgres://foodo:foodo@127.0.0.1:5432/foodo
      DJANGO_SECRET_KEY: ci-only-not-secret
      DJANGO_DEBUG: "0"
      DJANGO_SECURE: "0"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      # The browser talks to `vite preview` on :4174, which proxies /api to Django.
      DJANGO_CSRF_TRUSTED_ORIGINS: http://localhost:4174
      FOODO_SITE_URL: http://localhost:4174
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Start the API (migrations + seed data)
        working-directory: backend
        run: |
          pip install --require-hashes -r requirements.txt
          python manage.py migrate --noinput
          python manage.py load_seed
          nohup gunicorn foodo.wsgi:application --bind 127.0.0.1:8000 --workers 2 --no-control-socket > ../gunicorn.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/api/health/ && exit 0; sleep 1; done
          cat ../gunicorn.log; exit 1
      - working-directory: frontend
        run: npm ci --no-audit --no-fund
      - working-directory: frontend
        run: npx playwright install --with-deps chromium
      - working-directory: frontend
        run: npx playwright test
        env:
          E2E_ACCOUNT: "1"
      - if: failure()
        run: cat gunicorn.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-account-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7

  server-scripts:
    name: Server scripts — setup, re-setup, backup, update, restore on a clean machine
    runs-on: ubuntu-24.04
    env:
      COMPOSE: sudo docker compose -f /opt/foodo/docker-compose.prod.yml
      SITE: https://foodo.test
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Shell scripts and systemd units are valid
        run: |
          shellcheck deploy/server/*.sh
          bash -n deploy/server/*.sh
      - name: Setup with the previous release (TLS from Caddy's own CA)
        run: |
          releases=$(curl -fsSL "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases?per_page=2")
          echo "LATEST=$(printf '%s' "$releases" | python3 -c 'import json,sys; print(json.load(sys.stdin)[0]["tag_name"].lstrip("v"))')" >> "$GITHUB_ENV"
          prev=$(printf '%s' "$releases" | python3 -c 'import json,sys; print(json.load(sys.stdin)[1]["tag_name"].lstrip("v"))')
          echo "PREVIOUS=$prev" >> "$GITHUB_ENV"
          # Firewall and timers stay off on the CI machine; the timers would start an update mid-test.
          printf '%s\n' FOODO_DOMAIN=foodo.test FOODO_TLS=internal FOODO_ADMIN_EMAIL=admin@foodo.test \
            "FOODO_IMAGE_TAG=$prev" FOODO_SKIP_SYSTEM=1 FOODO_SKIP_TIMERS=1 > /tmp/setup.env
          sudo FOODO_REPO="$GITHUB_REPOSITORY" bash deploy/server/install.sh /tmp/setup.env
      - name: After setup — HTTPS, version, admin without a password, private settings
        run: |
          curl -fsSk --resolve foodo.test:443:127.0.0.1 "$SITE/api/health/" | tee /dev/stderr | grep -q "\"version\":\"$PREVIOUS\""
          curl -fsSk --resolve foodo.test:443:127.0.0.1 "$SITE/" | grep -q '<div id="root">'
          curl -fsSkI --resolve foodo.test:443:127.0.0.1 "$SITE/" | grep -qi '^strict-transport-security'
          $COMPOSE exec -T api python manage.py shell -c "from django.contrib.auth import get_user_model as g; u = g().objects.get(username='admin@foodo.test'); assert u.is_superuser and not u.has_usable_password()"
          test "$(sudo stat -c %a /opt/foodo/.env)" = 600
          test "$(sudo stat -c %a /opt/foodo/backups)" = 700
      - name: Re-running setup keeps the secrets and the data
        run: |
          before=$(sudo grep -E '^(DJANGO_SECRET_KEY|POSTGRES_PASSWORD)=' /opt/foodo/.env | sha256sum)
          $COMPOSE exec -T api python manage.py shell -c "from django.contrib.auth import get_user_model as g; g().objects.create_user(username='keep@example.com', email='keep@example.com', password=__import__('secrets').token_urlsafe(18))"
          sudo FOODO_REPO="$GITHUB_REPOSITORY" bash deploy/server/install.sh /tmp/setup.env
          test "$before" = "$(sudo grep -E '^(DJANGO_SECRET_KEY|POSTGRES_PASSWORD)=' /opt/foodo/.env | sha256sum)"
          $COMPOSE exec -T api python manage.py shell -c "from django.contrib.auth import get_user_model as g; assert g().objects.filter(username='keep@example.com').exists()"
      - name: Backup
        run: |
          sudo /opt/foodo/backup.sh
          dump=$(sudo sh -c 'ls -t /opt/foodo/backups/foodo-*.dump | head -n1')
          sudo test -s "$dump"
          echo "DUMP=$dump" >> "$GITHUB_ENV"
      - name: Update to the latest release keeps the data
        run: |
          sleep 1  # the update's own backup gets a different file name
          sudo /opt/foodo/update.sh
          sudo grep -q "^FOODO_IMAGE_TAG=$LATEST$" /opt/foodo/.env
          curl -fsSk --resolve foodo.test:443:127.0.0.1 "$SITE/api/health/" | grep -q "\"version\":\"$LATEST\""
          $COMPOSE exec -T api python manage.py shell -c "from django.contrib.auth import get_user_model as g; assert g().objects.filter(username='keep@example.com').exists()"
          sudo /opt/foodo/update.sh | tee /dev/stderr | grep -q "Уже версия $LATEST"
      - name: Restore brings back the state of the backup
        run: |
          $COMPOSE exec -T api python manage.py shell -c "from django.contrib.auth import get_user_model as g; g().objects.create_user(username='after@example.com', email='after@example.com', password=__import__('secrets').token_urlsafe(18))"
          if sudo /opt/foodo/restore.sh "$DUMP"; then echo "restore without --yes must refuse"; exit 1; fi
          sudo /opt/foodo/restore.sh "$DUMP" --yes
          $COMPOSE exec -T api python manage.py shell -c "from django.contrib.auth import get_user_model as g; u = g().objects; assert u.filter(username='keep@example.com').exists(); assert not u.filter(username='after@example.com').exists()"
      - name: systemd units
        run: |
          sudo install -m 644 deploy/server/foodo-*.service deploy/server/foodo-*.timer /etc/systemd/system/
          sudo systemd-analyze verify /etc/systemd/system/foodo-update.service /etc/systemd/system/foodo-update.timer /etc/systemd/system/foodo-backup.service /etc/systemd/system/foodo-backup.timer
      - if: failure()
        run: |
          $COMPOSE ps || true
          $COMPOSE logs --tail 100 || true

  docker:
    name: Docker — build images, clean start, health, restart keeps data
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Build and start the stack (migrations and seed on start)
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: Health and catalog through nginx
        run: |
          curl -sf http://localhost:8080/healthz
          curl -sf http://localhost:8080/api/health/ | tee /dev/stderr | grep -q '"database":"ok"'
          curl -sf http://localhost:8080/api/catalog/bundle/ | python3 -c "import json,sys; d=json.load(sys.stdin); assert len(d['recipes']) >= 40, len(d['recipes'])"
          curl -sf http://localhost:8080/ | grep -q '<div id="root">'
      - name: Restart keeps the database; seed load stays idempotent
        run: |
          docker compose exec -T api python manage.py shell -c "from django.contrib.auth import get_user_model as g; g().objects.create_user(username='keep@example.com', email='keep@example.com', password=__import__('secrets').token_urlsafe(18))"
          docker compose down
          docker compose up -d --wait --wait-timeout 300
          docker compose exec -T api python manage.py shell -c "from django.contrib.auth import get_user_model as g; assert g().objects.filter(email='keep@example.com').exists()"
          docker compose logs api | grep -E "Рецепты: создано 0" 
      - if: failure()
        run: docker compose logs
