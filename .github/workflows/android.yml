name: Android

# The Android app (docs/ANDROID.md): the guest-mode web build wrapped with Capacitor.
#   build    — web bundle, debug APK, minified release APK signed with the public debug key,
#              updater unit tests (Gradle), manifest checks;
#   emulator — both APKs on an Android 14 emulator: launch, UI visible, WebView checks (debug),
#              no crash; screenshots as artifacts;
#   release  — only when called by release.yml with `release: true`: the APK signed with the
#              key from the repository secrets, verified with apksigner.
# Pull requests never see the signing secrets: the release job runs only through workflow_call
# from release.yml, which is started manually on main.
#
# Third-party actions are pinned to full commit SHAs (tag in the comment).
on:
  pull_request:
    paths:
      - "frontend/**"
      - "shared/**"
      - "scripts/prices/**"
      - "VERSION"
      - ".github/workflows/android.yml"
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "shared/**"
      - "scripts/prices/**"
      - "VERSION"
      - ".github/workflows/android.yml"
  workflow_dispatch:
  workflow_call:
    inputs:
      release:
        description: Build the release APK signed with the repository key
        type: boolean
        default: false
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: false
      ANDROID_KEYSTORE_PASSWORD:
        required: false
      ANDROID_KEY_ALIAS:
        required: false

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  PYTHON_VERSION: "3.13"
  JAVA_VERSION: "21"

jobs:
  build:
    name: Web bundle, APKs, updater unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Publish collected prices for the bundled web app
        run: python -m scripts.prices.publish frontend/public/data/prices
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      # Also validates gradle-wrapper.jar against the official checksums.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Web bundle (Vite mode "android") and Capacitor sync
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          FOODO_VERSION="$(tr -d '[:space:]' < ../VERSION)" npx vite build --mode android
          npx cap sync android
      - name: Updater unit tests without Gradle (plain javac + JUnit)
        run: frontend/android/scripts/run-unit-tests.sh
      - name: Debug APK, minified release APK (debug key), unit tests
        working-directory: frontend/android
        run: ./gradlew --no-daemon --stacktrace assembleDebug testDebugUnitTest assembleRelease testReleaseUnitTest -PfoodoDebugSignRelease=true
      - name: Manifest checks (version, permissions, exported components)
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          version="$(tr -d '[:space:]' < VERSION)"
          mkdir -p apk
          cp frontend/android/app/build/outputs/apk/debug/app-debug.apk apk/foodo-debug.apk
          cp frontend/android/app/build/outputs/apk/release/app-release.apk apk/foodo-release-debugkey.apk
          python3 frontend/android/scripts/check-apk.py apk/foodo-debug.apk "$version"
          python3 frontend/android/scripts/check-apk.py apk/foodo-release-debugkey.apk "$version" --release
          ls -l apk
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-test-apks
          path: apk/
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: android-unit-test-reports
          path: frontend/android/app/build/reports/tests
          retention-days: 7

  emulator:
    name: Emulator smoke test (Android 14, x86_64)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android-test-apks
          path: apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install, launch, check, screenshot
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          # Each line runs separately.
          script: |
            bash frontend/android/scripts/emulator-smoke.sh apk/foodo-debug.apk debug smoke "$(tr -d '[:space:]' < VERSION)"
            bash frontend/android/scripts/emulator-smoke.sh apk/foodo-release-debugkey.apk release smoke "$(tr -d '[:space:]' < VERSION)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: android-emulator-smoke
          path: smoke/
          retention-days: 14

  release:
    name: Signed release APK
    if: inputs.release
    needs: [build, emulator]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Only from main
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then echo "::error::Signed APKs are built only from main (got $GITHUB_REF)"; exit 1; fi
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Publish collected prices for the bundled web app
        run: python -m scripts.prices.publish frontend/public/data/prices
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          # The signing job only reads the cache, it never writes to it.
          cache-read-only: true
      - name: Web bundle (Vite mode "android") and Capacitor sync
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          FOODO_VERSION="$(tr -d '[:space:]' < ../VERSION)" npx vite build --mode android
          npx cap sync android
      - name: Build and sign the release APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          umask 077
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS; do
            if [ -z "${!name}" ]; then echo "::error::Secret $name is missing (docs/ANDROID.md, «Ключ подписи»)"; exit 1; fi
          done
          version="$(tr -d '[:space:]' < VERSION)"
          work="$(mktemp -d)"
          # The decoded key exists only for this step.
          trap 'rm -rf "$work"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$work/foodo.p12"
          export FOODO_KEYSTORE_FILE="$work/foodo.p12"
          export FOODO_KEYSTORE_PASSWORD="$ANDROID_KEYSTORE_PASSWORD"
          export FOODO_KEY_ALIAS="$ANDROID_KEY_ALIAS"
          # Public certificate fingerprint of the key, to compare with what apksigner reads from the APK.
          keytool -list -v -storetype PKCS12 -keystore "$FOODO_KEYSTORE_FILE" -storepass:env FOODO_KEYSTORE_PASSWORD -alias "$FOODO_KEY_ALIAS" \
            | awk -F': ' '/SHA256:/ {print $2; exit}' | tr -d ':' | tr 'A-F' 'a-f' > "$RUNNER_TEMP/expected-cert-sha256"
          test -s "$RUNNER_TEMP/expected-cert-sha256"
          (cd frontend/android && ./gradlew --no-daemon --stacktrace assembleRelease testReleaseUnitTest)
          mkdir -p apk-release
          cp frontend/android/app/build/outputs/apk/release/app-release.apk "apk-release/foodo-$version.apk"
      - name: Verify the signature (v2 + v3, our certificate) and the manifest
        run: |
          set -euo pipefail
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          version="$(tr -d '[:space:]' < VERSION)"
          apk="apk-release/foodo-$version.apk"
          tools="$ANDROID_HOME/build-tools/$(ls -1 "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$tools/apksigner" verify --verbose --print-certs "$apk" | tee apksigner.txt
          grep -q '^Verified using v2 scheme (APK Signature Scheme v2): true' apksigner.txt
          grep -q '^Verified using v3 scheme (APK Signature Scheme v3): true' apksigner.txt
          grep -q '^Number of signers: 1' apksigner.txt
          cert="$(awk -F': ' '/^Signer #1 certificate SHA-256 digest:/ {print $2; exit}' apksigner.txt)"
          expected="$(cat "$RUNNER_TEMP/expected-cert-sha256")"
          if [ -z "$cert" ] || [ "$cert" != "$expected" ]; then echo "::error::APK certificate $cert differs from the repository key $expected"; exit 1; fi
          python3 frontend/android/scripts/check-apk.py "$apk" "$version" --release
          echo "$cert" > apk-release/signing-cert-sha256.txt
          {
            echo "### APK $version подписан"
            echo "Файл: \`foodo-$version.apk\`, $(stat -c %s "$apk") байт, SHA-256 \`$(sha256sum "$apk" | cut -d' ' -f1)\`"
            echo "Схемы подписи: v2 и v3 (apksigner verify)."
            echo "SHA-256 сертификата подписи: \`$cert\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: foodo-release-apk
          path: apk-release/
          retention-days: 7
          if-no-files-found: error
