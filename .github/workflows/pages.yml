name: Pages

# The public test site: the static PWA build in guest mode (no server, data stays in the browser).
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: main
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Publish collected prices for the static site
        run: python -m scripts.prices.publish frontend/public/data/prices
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          FOODO_VERSION="$(tr -d '[:space:]' < ../VERSION)" npx vite build --mode static --outDir dist-static
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: frontend/dist-static

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
  # A successful build is not a working site: check the deployed URL itself over HTTPS and run
  # the main guest path and the offline PWA check against it.
  verify:
    name: Live site — HTTPS, assets, guest path, offline
    needs: deploy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: main
      - name: HTTPS and key assets
        env:
          SITE: ${{ needs.deploy.outputs.page_url }}
        run: |
          case "$SITE" in https://*/) ;; *) echo "::error::Unexpected Pages URL: $SITE"; exit 1;; esac
          # The CDN may serve the previous build for a short while after deploy.
          for i in $(seq 1 24); do curl -sfI "$SITE" >/dev/null && break; sleep 5; done
          for path in "" manifest.webmanifest sw.js offline.html photos/borshch-s-govyadinoy.webp; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$SITE$path")
            echo "$code $SITE$path"
            [ "$code" = 200 ] || { echo "::error::$SITE$path returned $code"; exit 1; }
          done
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Guest path and offline mode on the live site
        working-directory: frontend
        env:
          E2E_BASE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
          npx playwright test -g "family → menu → shopping|works offline"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-live-site-report
          path: frontend/playwright-report
          retention-days: 7
