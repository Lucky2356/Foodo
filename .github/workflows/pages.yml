name: Pages

# The public test site: the static PWA build in guest mode (no server, data stays in the browser).
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Publish collected prices for the static site
        run: python -m scripts.prices.publish frontend/public/data/prices
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          FOODO_VERSION="$(tr -d '[:space:]' < ../VERSION)" npx vite build --mode static --outDir dist-static
      - uses: actions/upload-pages-artifact@v5
        with:
          path: frontend/dist-static

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
