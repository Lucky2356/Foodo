name: Prices

on:
  pull_request:
    paths:
      - "scripts/prices/**"
      - ".github/workflows/prices.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: Source reachability from GitHub runners
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python scripts/prices/probe.py
