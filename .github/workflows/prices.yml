name: Prices

# Collects public prices (Rosstat averages, Magnit's website) into shared/data/prices.
# - Pull requests touching the collector: a dry run (nothing is written or committed).
# - Weekly schedule or a manual run on main: the data is committed to main and the Pages site
#   is rebuilt with it. The server picks the data up on its next `load_seed` (every start).
on:
  pull_request:
    paths:
      - "scripts/prices/**"
      - ".github/workflows/prices.yml"
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prices-${{ github.ref }}
  # A newer push supersedes a PR dry run; scheduled/manual runs on main are never interrupted.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  collect:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: ${{ github.event_name != 'pull_request' }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: pip install --require-hashes -r scripts/prices/requirements.txt
      - name: Unit tests of the collector
        run: |
          pip install pytest==8.4.2
          python -m pytest -q scripts/prices/tests
      - name: Collect (dry run on pull requests)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            python -m scripts.prices.run --dry-run
          else
            python -m scripts.prices.run
          fi
      - name: Commit the data to main
        id: commit
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          git add shared/data/prices
          if git diff --cached --quiet; then echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          git commit -m "Update public prices (automated, $(date -u +%F))"
          # main may have moved during the collection (a merge, a release); the job only touches
          # shared/data/prices, so replaying the commit on top cannot conflict with code changes.
          git pull --rebase origin main
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

  pages:
    needs: collect
    if: needs.collect.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
