name: Prices

on:
  pull_request:
    paths:
      - "scripts/prices/**"
      - ".github/workflows/prices.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: Source reachability from GitHub runners
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Rosstat certificate chain
        run: |
          echo | openssl s_client -connect rosstat.gov.ru:443 -servername rosstat.gov.ru -showcerts 2>/dev/null | grep -E '^ *[0-9]+ s:|^ *i:|Verify return' || true
          curl -sS -o /dev/null -w '%{http_code}\n' https://rosstat.gov.ru/statistics/price || true
      - run: python scripts/prices/probe.py
