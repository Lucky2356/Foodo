name: Prices

on:
  pull_request:
    paths:
      - "scripts/prices/**"
      - ".github/workflows/prices.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: Source reachability from GitHub runners
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Rosstat certificate chain via AIA
        run: |
          set +e
          echo | openssl s_client -connect rosstat.gov.ru:443 -servername rosstat.gov.ru 2>/dev/null | openssl x509 > leaf.pem
          openssl x509 -in leaf.pem -noout -text | grep -A3 "Authority Information Access"
          aia=$(openssl x509 -in leaf.pem -noout -text | grep -o 'CA Issuers - URI:[^ ]*' | head -1 | cut -d: -f2-)
          echo "AIA=$aia"
          curl -sS -m 20 -o issuer.bin "$aia"; file issuer.bin
          openssl x509 -inform DER -in issuer.bin -out issuer.pem 2>/dev/null || cp issuer.bin issuer.pem
          openssl x509 -in issuer.pem -noout -subject -issuer -dates
          curl -sS -m 20 -o root.pem https://gu-st.ru/content/lending/russian_trusted_root_ca_pem.crt
          cat root.pem issuer.pem > bundle.pem
          curl -sS -m 30 --cacert bundle.pem -o page.html -w 'rosstat price page: %{http_code}\n' https://rosstat.gov.ru/statistics/price
          grep -oE 'href="[^"]+\.(xlsx?|zip|csv)"' page.html | head -40
          grep -oiE '<a[^>]+href="[^"]+"[^>]*>[^<]*средн[^<]*</a>' page.html | head -20
      - run: python scripts/prices/probe.py
