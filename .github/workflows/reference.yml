name: Reference data

# Checks reference data against its primary sources. МР 2.3.1.0253-21 (vitamin targets) is read
# from the publisher's site; the hosts are not reachable from every development environment.
on:
  pull_request:
    paths:
      - "scripts/reference/**"
      - "scripts/nutrition/**"
      - "shared/data/nutrient_targets.json"
      - ".github/workflows/reference.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vitamin-norms:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - run: pip install --require-hashes -r scripts/reference/requirements.txt
      - name: МР 2.3.1.0253-21 — vitamin rows
        run: python -m scripts.reference.mr_norms --check --page 33 --page 39 --page 53

  usda-sr-legacy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - name: USDA FoodData Central SR Legacy — food list
        run: python -m scripts.nutrition.usda --list --id-below 170322
